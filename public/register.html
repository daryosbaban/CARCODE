<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | CAR CODE</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="logo-row">
      <a href="/"><img src="/img/logo.svg" alt="CAR CODE" height="32"></a>
    </div>
    <h1>إنشاء حساب جديد</h1>
    <p class="sub">انضم مجاناً وابدأ تشخيص أعطال سيارتك الآن.</p>

    <div class="alert alert-error" id="alertBox"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">الاسم الكامل</label>
        <input type="text" id="name" required autocomplete="name" placeholder="اسمك">
      </div>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="email" placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="6 أحرف على الأقل">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        <span id="submitText">إنشاء الحساب</span>
        <span class="spinner" id="submitSpinner"></span>
      </button>
    </form>

    <div class="auth-foot">
      لديك حساب بالفعل؟ <a href="/login.html">سجّل دخولك</a>
    </div>
  </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
