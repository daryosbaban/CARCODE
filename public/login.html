<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | CAR CODE</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="logo-row">
      <a href="/"><img src="/img/logo.svg" alt="CAR CODE" height="32"></a>
    </div>
    <h1>تسجيل الدخول</h1>
    <p class="sub">أهلاً بعودتك! سجّل دخولك للوصول إلى قاعدة بيانات الأعطال.</p>

    <div class="alert alert-error" id="alertBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="email" placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        <span id="submitText">تسجيل الدخول</span>
        <span class="spinner" id="submitSpinner"></span>
      </button>
    </form>

    <div class="auth-foot">
      ليس لديك حساب؟ <a href="/register.html">أنشئ حساباً جديداً</a>
    </div>
  </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
